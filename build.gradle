plugins {
    id 'java'
    id 'application'
}

import java.util.zip.GZIPInputStream
import java.security.MessageDigest

group = 'com.flatide'
version = '0.7.0'

ext {
    defaultRuntimeLinuxX64Url = 'https://download.java.net/java/GA/jdk21.0.2/f2283984656d49d69e91c558476027ac/13/GPL/openjdk-21.0.2_linux-x64_bin.tar.gz'
    defaultRuntimeLinuxX64Sha256 = 'a2def047a73941e01a73739f92755f86b895811afb1f91243db214cff5bdac3f'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.flatide:propertee-core:0.7.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    testImplementation 'junit:junit:4.13.2'
}

// The embeddable, zero-dependency client lives outside src/ (it is copied verbatim into host
// projects). Pull it into the test source set so integration tests exercise the real deployable
// client, not just the in-module one.
sourceSets {
    test {
        java {
            srcDir 'client'
        }
    }
}

// Guard the standalone client's self-contained contract: compile it with an EMPTY classpath
// (proves zero external dependencies) targeting the --release 8 floor (JDK 17+ cannot emit
// bytecode 7). Runs as part of `check` / `build`.
task compileStandaloneClient(type: JavaCompile) {
    description = 'Compile the embeddable zero-dependency client in isolation (no classpath, --release 8).'
    group = 'verification'
    source = fileTree('client') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/standalone-client')
    options.release = 8
    options.encoding = 'UTF-8'  // non-ASCII in source/comments must not depend on platform default
}
tasks.named('check') { dependsOn 'compileStandaloneClient' }

// Compile the client to genuine Java 7 bytecode (major 51) so the distributable jar loads on Java 7
// hosts. JDK 17+ can no longer emit bytecode 7, so this uses a JDK 8 toolchain (whose javac still
// targets -source/-target 7). Gradle auto-provisions JDK 8 via the foojay resolver if it is not
// already installed — no manual/sudo system install needed. Zero external dependencies (empty classpath).
task compileClientJava7(type: JavaCompile) {
    description = 'Compile the embeddable client to Java 7 bytecode using a JDK 8 toolchain.'
    group = 'verification'
    source = fileTree('client') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('classes/standalone-client-java7')
    sourceCompatibility = '7'
    targetCompatibility = '7'
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

// Distributable jar of the embeddable client, for hosts that prefer a dependency over copying the
// source file. Zero external dependencies; bytecode is Java 7 (major 51), so it loads on Java 7+.
task clientJar(type: Jar) {
    dependsOn compileClientJava7
    archiveBaseName = 'teebox-client'
    archiveVersion = project.version
    destinationDirectory = layout.buildDirectory.dir('libs')
    from compileClientJava7.destinationDirectory
    manifest {
        attributes(
            'Implementation-Title': 'TeeBox embeddable client',
            'Implementation-Version': project.version,
            'Automatic-Module-Name': 'com.flatide.teebox.client'
        )
    }
    description = 'Build the embeddable zero-dependency TeeBox client jar (Java 7 bytecode, loads on Java 7+).'
    group = 'distribution'
}

task clientSourcesJar(type: Jar) {
    archiveBaseName = 'teebox-client'
    archiveVersion = project.version
    archiveClassifier = 'sources'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from(fileTree('client') { include '**/*.java' })
    description = 'Sources jar for the embeddable TeeBox client (IDE source attachment).'
    group = 'distribution'
}

application {
    mainClass = 'com.flatide.teebox.TeeBoxMain'
}

run {
    standardInput = System.in
    systemProperties System.properties.findAll { key, value ->
        key.startsWith('propertee.teebox.') || key.startsWith('propertee.task.')
    }
}

tasks.withType(Test).configureEach {
    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
    }
}

task teeBoxJar(type: Jar) {
    dependsOn classes
    archiveBaseName = 'propertee-teebox'
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'com.flatide.teebox.TeeBoxMain'
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

task teeBoxDist(type: Copy) {
    dependsOn teeBoxJar
    into "${buildDir}/teebox-dist"
    from(teeBoxJar.archiveFile) {
        into 'lib'
    }
    from('deploy/teebox/teebox.properties') {
        into 'conf'
    }
    from('deploy/teebox/run-teebox.sh') {
        into 'bin'
    }
    from('deploy/teebox/run-teebox.bat') {
        into 'bin'
    }
    from('deploy/teebox/README.md') {
        into '.'
    }
    from('LICENSE') {
        into '.'
    }
    from('deploy/teebox/log4j2.xml') {
        into 'conf'
    }
    description = 'Build a deployable ProperTee TeeBox directory'
    group = 'distribution'
}

task teeBoxDistWithRuntime(type: Copy) {
    dependsOn teeBoxDist
    into "${buildDir}/teebox-dist-with-runtime"
    from("${buildDir}/teebox-dist")

    doFirst {
        File bundledRuntimeDir = file("${buildDir}/runtime-linux-x64")
        File localRuntimeDir = file('deploy/teebox/runtime-linux-x64')
        File selectedRuntimeDir = bundledRuntimeDir.exists() ? bundledRuntimeDir :
            (localRuntimeDir.exists() ? localRuntimeDir : null)
        if (selectedRuntimeDir == null) {
            throw new GradleException(
                "No runtime found. Run fetchRuntimeLinuxX64 first or place a runtime under deploy/teebox/runtime-linux-x64"
            )
        }
        from(selectedRuntimeDir) {
            into 'runtime'
        }
    }

    description = 'Build a deployable ProperTee TeeBox directory including a Linux x86_64 runtime'
    group = 'distribution'
}

task fetchRuntimeLinuxX64 {
    description = 'Download and unpack a Linux x86_64 Java runtime into build/runtime-linux-x64'
    group = 'distribution'

    doLast {
        String configuredUrl = System.getProperty('propertee.teebox.runtimeLinuxX64Url')
        if (configuredUrl == null || configuredUrl.trim().isEmpty()) {
            configuredUrl = System.getenv('PROPERTEE_TEEBOX_RUNTIME_LINUX_X64_URL')
        }
        if (configuredUrl == null || configuredUrl.trim().isEmpty()) {
            configuredUrl = defaultRuntimeLinuxX64Url
        }
        String configuredSha256 = System.getProperty('propertee.teebox.runtimeLinuxX64Sha256')
        if (configuredSha256 == null || configuredSha256.trim().isEmpty()) {
            configuredSha256 = System.getenv('PROPERTEE_TEEBOX_RUNTIME_LINUX_X64_SHA256')
        }
        if (configuredSha256 == null || configuredSha256.trim().isEmpty()) {
            configuredSha256 = defaultRuntimeLinuxX64Sha256
        }

        File runtimeDir = file("${buildDir}/runtime-linux-x64")
        File downloadsDir = file("${buildDir}/runtime-downloads")
        File archiveFile = file("${downloadsDir}/runtime-linux-x64.tar.gz")

        runtimeDir.deleteDir()
        downloadsDir.mkdirs()

        logger.lifecycle("Downloading Linux x86_64 runtime from {}", configuredUrl)
        new URL(configuredUrl).withInputStream { input ->
            archiveFile.withOutputStream { output ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) >= 0) {
                    output.write(buffer, 0, read)
                }
            }
        }

        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        archiveFile.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = input.read(buffer)) >= 0) {
                digest.update(buffer, 0, read)
            }
        }
        String actualSha256 = digest.digest().collect { String.format('%02x', it) }.join()
        if (!actualSha256.equalsIgnoreCase(configuredSha256.trim())) {
            throw new GradleException(
                "Runtime SHA-256 mismatch. Expected ${configuredSha256}, got ${actualSha256}"
            )
        }

        copy {
            from tarTree(resources.gzip(archiveFile))
            into runtimeDir
            eachFile { details ->
                String path = details.path
                int slash = path.indexOf('/')
                if (slash >= 0) {
                    details.path = path.substring(slash + 1)
                }
            }
            includeEmptyDirs = false
        }

        File javaBin = file("${runtimeDir}/bin/java")
        if (!javaBin.exists()) {
            throw new GradleException("Downloaded archive did not produce runtime/bin/java under ${runtimeDir}")
        }
        logger.lifecycle("Runtime unpacked to {}", runtimeDir)
    }
}

task teeBoxZip(type: Zip) {
    dependsOn teeBoxDist
    archiveBaseName = 'propertee-teebox'
    archiveClassifier = 'dist'
    destinationDirectory = file("${buildDir}/distributions")
    from("${buildDir}/teebox-dist")
    description = 'Build a deployable ProperTee TeeBox zip archive'
    group = 'distribution'

    doLast {
        copy {
            from archiveFile
            into "${rootDir}/dist"
        }
    }
}

task teeBoxZipWithRuntime(type: Zip) {
    dependsOn teeBoxDistWithRuntime
    archiveBaseName = 'propertee-teebox'
    archiveClassifier = 'dist-with-runtime'
    destinationDirectory = file("${buildDir}/distributions")
    from("${buildDir}/teebox-dist-with-runtime")
    description = 'Build a deployable ProperTee TeeBox zip archive including a Linux x86_64 runtime'
    group = 'distribution'
}

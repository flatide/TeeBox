openapi: 3.0.3
info:
  title: TeeBox API
  description: |
    HTTP API for remote ProperTee script execution, run management, task monitoring, and script registry.

    TeeBox provides three API namespaces, each with independent Bearer token authentication:
    - **Client** — run submission and result polling
    - **Admin** — inspection, control, and system monitoring
    - **Publisher** — script registration and version management

    The admin HTML dashboard is served at `/admin` (not covered in this spec).
  version: 0.3.0
  contact:
    name: Flatide
    url: https://github.com/flatide/propertee-java

servers:
  - url: http://127.0.0.1:18080
    description: Local development

tags:
  - name: Client
    description: Run submission and result polling
  - name: Admin
    description: Run/task inspection and control
  - name: Publisher
    description: Script registration and version management

security:
  - BearerAuth: []

paths:
  # ── Client API ──────────────────────────────────────────────

  /api/client/runs:
    get:
      tags: [Client]
      summary: List runs
      operationId: clientListRuns
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Array of run summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientRunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Client]
      summary: Submit a script by file path
      operationId: clientSubmitRun
      security:
        - ClientToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '202':
          description: Run accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRunSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/client/scripts/{scriptId}/runs:
    get:
      tags: [Client]
      summary: List runs for a registered script
      operationId: clientListScriptRuns
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/ScriptId'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Array of run summaries for the script
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClientRunSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Client]
      summary: Submit a registered script for execution
      operationId: clientSubmitScriptRun
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/ScriptId'
        - name: X-TeeBox-User
          in: header
          required: false
          description: >-
            Optional submitter identity, recorded on the run as `submittedBy` (shown in the admin
            Runs list "By" column and run detail page, returned in run status/summary/result JSON).
            Sanitized server-side (control chars stripped, trimmed, max 128 chars). Display/audit
            only — NOT authentication.
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptRunRequest'
      responses:
        '202':
          description: Run accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRunSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/client/runs/{runId}:
    get:
      tags: [Client]
      summary: Get run detail
      operationId: clientGetRun
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRunSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/client/runs/{runId}/cancel:
    post:
      tags: [Client]
      summary: Cancel a run
      description: >
        Cancel a run in any non-terminal state. QUEUED/PENDING runs are cancelled immediately;
        a RUNNING run is aborted cooperatively (the engine stops at its next checkpoint and the
        run's SHELL tasks are killed on a background thread), so this returns 202 as soon as the
        cancel is requested — poll the run until it reaches `CANCELLED` (or `COMPLETED`, if the
        run finished first; a completed run is never flipped). Any client-token holder may cancel
        any run (the client token is a shared credential; `X-TeeBox-User` is recorded in the
        cancel reason for audit only).
      operationId: clientCancelRun
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '202':
          description: Cancel requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRunResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Run already finished

  /api/client/runs/{runId}/status:
    get:
      tags: [Client]
      summary: Get run status
      operationId: clientGetRunStatus
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRunStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/client/runs/{runId}/result:
    get:
      tags: [Client]
      summary: Get run result
      operationId: clientGetRunResult
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRunResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/client/runs/{runId}/result-stream:
    get:
      tags: [Client]
      summary: Stream a large run result (STREAM_FILE)
      description: >
        When the script returned a stream descriptor (e.g. `return STREAM_FILE(path)`), this streams
        the referenced file's raw bytes directly to the response (no buffering / no JSON envelope),
        with Content-Type from the descriptor and Content-Length = file size. The path is confined to
        the configured allowed roots. Returns 409 if the run's result is not a stream (or the file is
        gone).
      operationId: clientStreamRunResult
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The result file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '409':
          description: Run result is not a stream, or the file is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/client/runs/{runId}/tasks-summary:
    get:
      tags: [Client]
      summary: Get task summary for a run
      operationId: clientGetTasksSummary
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Task count breakdown by status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientTaskSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/client/runs/{runId}/stdout:
    get:
      tags: [Client]
      summary: Get captured run stdout (script PRINT output)
      description: >
        Returns the run's captured stdout lines (the most recent MAX_LOG_LINES,
        default 200 — a server-side ring buffer). Readable while the run is
        RUNNING and after it ends.
      operationId: clientGetRunStdout
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Captured stdout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRunOutput'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/client/runs/{runId}/stderr:
    get:
      tags: [Client]
      summary: Get captured run stderr
      operationId: clientGetRunStderr
      security:
        - ClientToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Captured stderr
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientRunOutput'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Admin API ───────────────────────────────────────────────

  /api/admin/system:
    get:
      tags: [Admin]
      summary: Get system info
      description: Returns JVM, memory, disk, data directory sizes, and server configuration.
      operationId: adminGetSystemInfo
      security:
        - AdminToken: []
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/runs:
    get:
      tags: [Admin]
      summary: List runs (full detail)
      operationId: adminListRuns
      security:
        - AdminToken: []
      parameters:
        - $ref: '#/components/parameters/StatusFilter'
        - name: instant
          in: query
          required: false
          description: >-
            Instant-run filter ("instant" = a run of an immediate=true script): `exclude` hides
            instant runs, `only` returns only them; absent = all runs.
          schema:
            type: string
            enum: [exclude, only]
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on the run ID or the script ID.
          schema:
            type: string
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Array of full RunInfo objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/runs/{runId}:
    get:
      tags: [Admin]
      summary: Get run detail with threads and tasks
      operationId: adminGetRun
      security:
        - AdminToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminRunDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/runs/{runId}/threads:
    get:
      tags: [Admin]
      summary: List threads for a run
      operationId: adminListRunThreads
      security:
        - AdminToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Array of thread snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RunThreadInfo'

  /api/admin/runs/{runId}/tasks:
    get:
      tags: [Admin]
      summary: List tasks for a run
      operationId: adminListRunTasks
      security:
        - AdminToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Array of task info objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskInfo'

  /api/admin/runs/{runId}/kill-tasks:
    post:
      tags: [Admin]
      summary: Kill all tasks for a run
      operationId: adminKillRunTasks
      security:
        - AdminToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Kill result
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: string
                  killed:
                    type: integer
                    description: Number of tasks killed

  /api/admin/runs/{runId}/cancel:
    post:
      tags: [Admin]
      summary: Cancel a run
      description: Same behavior as the client cancel endpoint, under the admin token.
      operationId: adminCancelRun
      security:
        - AdminToken: []
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '202':
          description: Cancel requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelRunResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Run already finished

  /api/admin/tasks:
    get:
      tags: [Admin]
      summary: List tasks
      operationId: adminListTasks
      security:
        - AdminToken: []
      parameters:
        - name: runId
          in: query
          schema:
            type: string
          description: Filter by run ID
        - name: status
          in: query
          schema:
            type: string
          description: Filter by task status
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tasks list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskInfo'

  /api/admin/tasks/{taskId}:
    get:
      tags: [Admin]
      summary: Get task detail
      operationId: adminGetTask
      security:
        - AdminToken: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Task detail with observation and output tails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTaskDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/tasks/{taskId}/kill:
    post:
      tags: [Admin]
      summary: Kill a task
      operationId: adminKillTask
      security:
        - AdminToken: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Kill result
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                  killed:
                    type: boolean
                    description: Whether the task was successfully killed

  /api/admin/shutdown:
    post:
      summary: Initiate graceful shutdown (drain mode)
      tags: [Admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                maxWaitMs:
                  type: integer
                  description: Timeout in ms before forced shutdown
                  default: 300000
      responses:
        '200':
          description: Drain started
          content:
            application/json:
              schema:
                type: object
                properties:
                  draining:
                    type: boolean
                  maxWaitMs:
                    type: integer
                  drainStartedAt:
                    type: integer
                    format: int64

  /api/admin/drain-status:
    get:
      summary: Get current drain status
      tags: [Admin]
      responses:
        '200':
          description: Drain status
          content:
            application/json:
              schema:
                type: object
                properties:
                  draining:
                    type: boolean
                  drainStartedAt:
                    type: integer
                    format: int64
                  activeRuns:
                    type: integer
                  queuedRuns:
                    type: integer

  # ── Publisher API ───────────────────────────────────────────

  /api/publisher/scripts:
    get:
      tags: [Publisher]
      summary: List all registered scripts
      operationId: publisherListScripts
      security:
        - PublisherToken: []
      responses:
        '200':
          description: Array of script info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScriptInfo'

    post:
      tags: [Publisher]
      summary: Register a new script version
      operationId: publisherRegisterScript
      security:
        - PublisherToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptPublishRequest'
      responses:
        '201':
          description: Script version registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptInfo'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/publisher/scripts/{scriptId}:
    get:
      tags: [Publisher]
      summary: Get script info
      operationId: publisherGetScript
      security:
        - PublisherToken: []
      parameters:
        - $ref: '#/components/parameters/ScriptId'
      responses:
        '200':
          description: Script info with version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptInfo'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete script and all versions
      tags: [Publisher]
      parameters:
        - name: scriptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Script deleted
        '404':
          description: Script not found

  /api/publisher/scripts/{scriptId}/versions:
    post:
      tags: [Publisher]
      summary: Register a version for a specific script
      operationId: publisherRegisterVersion
      security:
        - PublisherToken: []
      parameters:
        - $ref: '#/components/parameters/ScriptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScriptPublishRequest'
      responses:
        '201':
          description: Version registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptInfo'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/publisher/scripts/{scriptId}/versions/{version}:
    delete:
      tags: [Publisher]
      summary: Delete one script version (hard delete)
      description: >-
        Removes the version's metadata entry and its stored content. The active version is
        protected — activate another version first. Unlike script delete there is no
        soft-delete/restore window.
      operationId: publisherDeleteVersion
      security:
        - PublisherToken: []
      parameters:
        - $ref: '#/components/parameters/ScriptId'
        - name: version
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Version deleted; updated script info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptInfo'
        '400':
          description: Active version, unknown version, or unknown script
        '404':
          description: Malformed path

  /api/publisher/scripts/{scriptId}/duplicate:
    post:
      tags: [Publisher]
      summary: Duplicate a script to a new id
      description: >-
        Copies every version (content and metadata), the active-version choice, and the execution
        settings to a new script id. The copy is immediately runnable. This is the supported
        "rename" path — duplicate, point callers at the new id, then delete the old script; run
        history stays with the source.
      operationId: publisherDuplicateScript
      security:
        - PublisherToken: []
      parameters:
        - $ref: '#/components/parameters/ScriptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newScriptId]
              properties:
                newScriptId:
                  type: string
                  description: Target script id ([A-Za-z0-9._-])
      responses:
        '201':
          description: Script duplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptInfo'
        '400':
          description: Target id already exists, source unknown, or source is soft-deleted

  /api/publisher/scripts/{scriptId}/activate:
    post:
      tags: [Publisher]
      summary: Activate a script version
      operationId: publisherActivateVersion
      security:
        - PublisherToken: []
      parameters:
        - $ref: '#/components/parameters/ScriptId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                  description: Version to activate
      responses:
        '200':
          description: Version activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScriptInfo'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/publisher/scripts/{scriptId}/restore:
    post:
      summary: Restore a soft-deleted script
      tags: [Publisher]
      parameters:
        - name: scriptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Script restored
        '404':
          description: Script not found or not deleted

  /api/publisher/scripts/{scriptId}/settings:
    put:
      summary: Update script execution settings
      tags: [Publisher]
      parameters:
        - name: scriptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxConcurrentRuns:
                  type: integer
                  description: Max concurrent runs (0 = unlimited)
                  default: 0
                immediate:
                  type: boolean
                  description: Bypass global queue (per-script concurrency limit still applies)
                  default: false
      responses:
        '200':
          description: Updated script info

# ══════════════════════════════════════════════════════════════
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Default API token (`propertee.teebox.apiToken`)
    ClientToken:
      type: http
      scheme: bearer
      description: Client API token (`propertee.teebox.clientApiToken`, falls back to `apiToken`)
    AdminToken:
      type: http
      scheme: bearer
      description: Admin API token (`propertee.teebox.adminApiToken`, falls back to `apiToken`)
    PublisherToken:
      type: http
      scheme: bearer
      description: Publisher API token (`propertee.teebox.publisherApiToken`, falls back to `apiToken`)

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
      example: run-20260312-143022-001-a1b2
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
      example: task-1
    ScriptId:
      name: scriptId
      in: path
      required: true
      schema:
        type: string
      example: my-script
    StatusFilter:
      name: status
      in: query
      schema:
        type: string
      description: Filter by status (e.g. RUNNING, COMPLETED, FAILED)
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: Pagination offset
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: -1
      description: Max items to return (-1 for unlimited)

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # ── Common ──

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      example:
        error: "Run not found"

    # ── Run ──

    RunRequest:
      type: object
      description: Request to submit a script by file path.
      required: [scriptPath]
      properties:
        scriptPath:
          type: string
          description: Relative path to .tee script (under scriptsRoot)
          example: "01_hello.tee"
        props:
          type: object
          additionalProperties: true
          description: Built-in properties passed to the script
          example: {"width": 100, "name": "test"}
        maxIterations:
          type: integer
          default: 1000
          description: Maximum loop iterations before error/warning
        warnLoops:
          type: boolean
          default: false
          description: Warn instead of error on loop iteration limit
        timeoutMs:
          type: integer
          format: int64
          default: 0
          description: >
            Wall-clock execution timeout in ms, measured from RUNNING (queue wait excluded);
            on expiry the run is cancelled (status CANCELLED, reason in errorMessage).
            0 = use the server default (`runTimeoutMs` config), which itself defaults to off.

    ScriptRunRequest:
      type: object
      description: Request to submit a registered script for execution. The scriptId comes from the URL path.
      properties:
        version:
          type: string
          description: Script version (defaults to active version if omitted)
        props:
          type: object
          additionalProperties: true
          description: Built-in properties passed to the script
          example: {"width": 100, "name": "test"}
        maxIterations:
          type: integer
          default: 1000
          description: Maximum loop iterations before error/warning
        warnLoops:
          type: boolean
          default: false
          description: Warn instead of error on loop iteration limit
        timeoutMs:
          type: integer
          format: int64
          default: 0
          description: >
            Wall-clock execution timeout in ms, measured from RUNNING (queue wait excluded);
            on expiry the run is cancelled (status CANCELLED, reason in errorMessage).
            0 = use the server default (`runTimeoutMs` config), which itself defaults to off.

    RunInfo:
      type: object
      description: Full run execution details
      properties:
        runId:
          type: string
        scriptPath:
          type: string
        scriptId:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        scriptAbsolutePath:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        archived:
          type: boolean
        immediate:
          type: boolean
          description: True when the run's script had immediate=true at submit time (an "instant run").
        submittedBy:
          type: string
          nullable: true
          description: Submitter identity (X-TeeBox-User header / admin-UI session username); null = anonymous.
        createdAt:
          type: integer
          format: int64
          description: Epoch milliseconds
        startedAt:
          type: integer
          format: int64
          nullable: true
        endedAt:
          type: integer
          format: int64
          nullable: true
        maxIterations:
          type: integer
        iterationLimitBehavior:
          type: string
          enum: [error, warn]
        timeoutMs:
          type: integer
          format: int64
          description: Per-run execution timeout (ms, from RUNNING); 0 = server default
        stdoutTotalLines:
          type: integer
          description: Total stdout lines ever appended (stdoutLines is ring-capped); 0 for legacy runs
        stderrTotalLines:
          type: integer
          description: Total stderr lines ever appended (stderrLines is ring-capped); 0 for legacy runs
        hasExplicitReturn:
          type: boolean
        resultData:
          description: Script return value (any JSON type)
          nullable: true
        resultSummary:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        properties:
          type: object
          additionalProperties: true
        threads:
          type: array
          items:
            $ref: '#/components/schemas/RunThreadInfo'
        stdoutLines:
          type: array
          items:
            type: string
          description: Ring buffer of stdout (max 200 lines)
        stderrLines:
          type: array
          items:
            type: string
          description: Ring buffer of stderr (max 200 lines)
        published:
          type: object
          description: Captured output values from task stdout/stderr
          additionalProperties: true

    RunStatus:
      type: string
      enum: [QUEUED, PENDING, RUNNING, COMPLETED, FAILED, CANCELLED, SERVER_RESTARTED]
      description: |
        Run execution status:
          * `QUEUED` - waiting in the global run queue
          * `PENDING` - blocked by per-script concurrency limit
          * `RUNNING` - currently executing
          * `COMPLETED` - finished successfully
          * `FAILED` - finished with an error
          * `CANCELLED` - stopped by operator/client cancel or run timeout (reason in errorMessage;
            added in 1.16.0 — a pre-1.16 TeeBox reading a persisted CANCELLED run parses its status
            as null and shows it as SERVER_RESTARTED after restart, cosmetic only)
          * `SERVER_RESTARTED` - was interrupted by a server restart

    RunThreadInfo:
      type: object
      description: Per-thread execution state snapshot
      properties:
        threadId:
          type: integer
          description: "Thread ID (0=main, -1=monitor)"
        name:
          type: string
        state:
          type: string
          enum: [READY, RUNNING, SLEEPING, BLOCKED, WAITING, COMPLETED, ERROR]
        parentId:
          type: integer
          nullable: true
        inThreadContext:
          type: boolean
          description: True if spawned inside a multi block
        sleepUntil:
          type: integer
          format: int64
          nullable: true
        asyncPending:
          type: boolean
        resultKeyName:
          type: string
          nullable: true
        resultSummary:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        updatedAt:
          type: integer
          format: int64

    # ── Client-specific response shapes ──

    ClientRunSummary:
      type: object
      properties:
        runId:
          type: string
        scriptId:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        scriptPath:
          type: string
        status:
          type: string
        submittedBy:
          type: string
          nullable: true
          description: Submitter identity (X-TeeBox-User header / admin-UI session username); null = anonymous.
        createdAt:
          type: integer
          format: int64
        startedAt:
          type: integer
          format: int64
          nullable: true
        endedAt:
          type: integer
          format: int64
          nullable: true
        hasExplicitReturn:
          type: boolean
        resultSummary:
          type: string
          nullable: true
        errorMessage:
          type: string
          nullable: true
        published:
          type: object
          description: Captured output values from task stdout/stderr
          additionalProperties: true

    ClientRunStatus:
      type: object
      properties:
        runId:
          type: string
        scriptId:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        status:
          type: string
        createdAt:
          type: integer
          format: int64
        startedAt:
          type: integer
          format: int64
          nullable: true
        endedAt:
          type: integer
          format: int64
          nullable: true
        hasExplicitReturn:
          type: boolean
        errorMessage:
          type: string
          nullable: true

    ClientRunResult:
      type: object
      properties:
        runId:
          type: string
        scriptId:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        status:
          type: string
        hasExplicitReturn:
          type: boolean
        resultData:
          description: Script return value (any JSON type)
          nullable: true
        errorMessage:
          type: string
          nullable: true
        published:
          type: object
          description: Captured output values from task stdout/stderr
          additionalProperties: true
        result:
          $ref: '#/components/schemas/RunResultEnvelope'

    RunResultEnvelope:
      type: object
      description: >
        The whole run viewed as a ProperTee Result — one shape for every outcome, exactly like a
        `multi` collection entry (the run is "thread #0"). `COMPLETED` → `{status: done, ok: true,
        value: <resultData>}`; `FAILED` → `{status: error, ok: false, value: <errorMessage>}`;
        `CANCELLED` → `{status: error, ok: false, value: <cancel reason>}`;
        not yet terminal → `{status: running, ok: false, value: {}}`; `SERVER_RESTARTED` →
        `{status: error, ok: false, value: "server restarted"}`. A script that deliberately returns
        a ProperTee Result nests it inside `value` (the shape is never inspected). A value-less run
        yields `value: {}`.
      properties:
        status:
          type: string
          enum: [done, error, running]
        ok:
          type: boolean
        value:
          description: Script return value (done), error message (error), or {} (running/value-less)
          nullable: true

    ClientRunOutput:
      type: object
      properties:
        runId:
          type: string
        scriptId:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        status:
          type: string
        stream:
          type: string
          enum: [stdout, stderr]
        lines:
          type: array
          description: Captured output lines (most recent `runOutputMaxLines`, default 200)
          items:
            type: string
        lineCount:
          type: integer
          description: Retained line count (== lines.length)
        totalLineCount:
          type: integer
          description: >
            Total lines the script ever printed on this stream — larger than lineCount when the
            ring buffer dropped older lines. Runs persisted before 1.16.0 report it as lineCount.
        truncated:
          type: boolean
          description: True when older lines were dropped (totalLineCount > lineCount)

    CancelRunResponse:
      type: object
      properties:
        runId:
          type: string
        status:
          $ref: '#/components/schemas/RunStatus'
        cancelRequested:
          type: boolean

    ClientTaskSummary:
      type: object
      properties:
        runId:
          type: string
        total:
          type: integer
        running:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        killed:
          type: integer
        other:
          type: integer

    # ── Admin-specific response shapes ──

    AdminRunDetail:
      type: object
      properties:
        run:
          $ref: '#/components/schemas/RunInfo'
        threads:
          type: array
          items:
            $ref: '#/components/schemas/RunThreadInfo'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskInfo'

    AdminTaskDetail:
      type: object
      properties:
        task:
          $ref: '#/components/schemas/TaskInfo'
        observation:
          $ref: '#/components/schemas/TaskObservation'
        stdoutTail:
          type: string
          description: Last 4000 characters of stdout
        stderrTail:
          type: string
          description: Last 4000 characters of stderr

    # ── Task ──

    TaskInfo:
      type: object
      description: Task (external process) state with computed fields
      properties:
        taskId:
          type: string
        runId:
          type: string
          nullable: true
        threadId:
          type: integer
          nullable: true
        threadName:
          type: string
          nullable: true
        command:
          type: string
        pid:
          type: integer
        pgid:
          type: integer
        status:
          type: string
          description: "One of: running, completed, failed, killed, lost"
        alive:
          type: boolean
        archived:
          type: boolean
        elapsedMs:
          type: integer
          format: int64
        lastStdoutAt:
          type: integer
          format: int64
          nullable: true
        lastStderrAt:
          type: integer
          format: int64
          nullable: true
        lastOutputAgeMs:
          type: integer
          format: int64
          nullable: true
        timeoutExceeded:
          type: boolean
        exitCode:
          type: integer
          nullable: true
        cwd:
          type: string
          nullable: true
        hostInstanceId:
          type: string
        healthHints:
          type: array
          items:
            type: string
          description: "Diagnostic hints: TIMEOUT_EXCEEDED, PROCESS_NOT_FOUND, IDENTITY_UNVERIFIED"

    TaskObservation:
      type: object
      description: Task state snapshot at observation time
      properties:
        taskId:
          type: string
        status:
          type: string
        alive:
          type: boolean
        elapsedMs:
          type: integer
          format: int64
        lastStdoutAt:
          type: integer
          format: int64
          nullable: true
        lastStderrAt:
          type: integer
          format: int64
          nullable: true
        lastOutputAgeMs:
          type: integer
          format: int64
          nullable: true
        timeoutExceeded:
          type: boolean
        healthHints:
          type: array
          items:
            type: string

    # ── Script Registry ──

    ScriptInfo:
      type: object
      description: Registered script with version history
      properties:
        scriptId:
          type: string
        activeVersion:
          type: string
          nullable: true
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ScriptVersionInfo'
        maxConcurrentRuns:
          type: integer
          description: Max concurrent runs (0 = unlimited)
          default: 0
        immediate:
          type: boolean
          description: Bypass global queue for this script (per-script concurrency limit still applies)
          default: false
        deletedAt:
          type: integer
          format: int64
          description: Soft-delete timestamp (0 = active)
          default: 0

    ScriptVersionInfo:
      type: object
      properties:
        version:
          type: string
        description:
          type: string
          nullable: true
        labels:
          type: array
          items:
            type: string
        sha256:
          type: string
          description: SHA-256 hash of script content
        createdAt:
          type: integer
          format: int64
        active:
          type: boolean

    ScriptPublishRequest:
      type: object
      required: [scriptId, version, content]
      properties:
        scriptId:
          type: string
          description: Script identifier
        version:
          type: string
          description: Version string
        content:
          type: string
          description: ProperTee script source code
        description:
          type: string
          nullable: true
        labels:
          type: array
          items:
            type: string
        activate:
          type: boolean
          default: false
          description: Whether to immediately activate this version
        outputRules:
          type: array
          items:
            type: object
            properties:
              stream:
                type: string
                enum: [stdout, stderr]
                default: stdout
              pattern:
                type: string
                description: Regex pattern for output capture
              captureGroup:
                type: integer
                default: 1
              publishKey:
                type: string
                description: Key name for published value
              firstOnly:
                type: boolean
                default: true
                description: >
                  true (default): publish the first match only. false: continuous capture —
                  every match is published (key = latest value, key.values = capture list,
                  key.count = total, key.detectedAt = last capture time) until the task
                  terminates or maxCaptures is reached.
              taskKey:
                type: string
                description: >
                  Which task this rule watches. Absent/empty = the run's first task.
                  Otherwise the first task launched with env TEEBOX_TASK_KEY equal to this
                  value (script: SHELL(cmd, {"env": {"TEEBOX_TASK_KEY": "worker1"}})).
              maxCaptures:
                type: integer
                default: 0
                description: >
                  Continuous mode only (firstOnly=false) — stop after this many captures.
                  0 = unlimited (capture until the task terminates).

    # ── System ──

    SystemInfo:
      type: object
      description: Server runtime and system metrics
      properties:
        heapUsed:
          type: integer
          format: int64
          description: JVM heap memory used (bytes)
        heapMax:
          type: integer
          format: int64
          description: JVM heap memory maximum (bytes)
        nonHeapUsed:
          type: integer
          format: int64
          description: JVM non-heap memory used (bytes)
        nonHeapCommitted:
          type: integer
          format: int64
          description: JVM non-heap memory committed (bytes)
        diskTotal:
          type: integer
          format: int64
          description: Filesystem total capacity (bytes)
        diskFree:
          type: integer
          format: int64
          description: Filesystem free space (bytes)
        diskUsable:
          type: integer
          format: int64
          description: Filesystem usable space (bytes)
        runsDirSize:
          type: integer
          format: int64
          description: "Size of runs/ directory (bytes)"
        tasksDirSize:
          type: integer
          format: int64
          description: "Size of tasks/ directory (bytes)"
        scriptRegistryDirSize:
          type: integer
          format: int64
          description: "Size of script-registry/ directory (bytes)"
        totalDataSize:
          type: integer
          format: int64
          description: Total data directory size (bytes)
        javaVersion:
          type: string
        javaVendor:
          type: string
        osName:
          type: string
        osArch:
          type: string
        uptimeMs:
          type: integer
          format: int64
          description: Server uptime (milliseconds)
        availableProcessors:
          type: integer
          description: Number of CPU cores
        scriptsRootPath:
          type: string
        dataDirPath:
          type: string
        maxConcurrentRuns:
          type: integer
        bindAddress:
          type: string
        port:
          type: integer
